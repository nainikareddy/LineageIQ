[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lineageiq"
version = "0.1.0"
description = "Evaluation-first auditing for BI sprawl and semantic drift."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "networkx>=3.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[project.scripts]
lineageiq = "lineageiq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lineageiq", "synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generates a standalone HTML page; embeds full CSS/JS as string literals.
"tools/render_lineage.py" = ["E501"]
